; KEMURI – Ergaenzungen fuer <DeinProjekt>/Config/DefaultEngine.ini
; Die Zeilen unter dem jeweiligen Abschnitt einfuegen (Abschnitt existiert meist schon).
; Alles laesst sich auch in den Projekteinstellungen unter Rendering setzen; dort gewinnt der zuletzt gespeicherte Wert.

[/Script/Engine.RendererSettings]
; Custom Depth-Stencil mit Stencil: IR-Gluehen (2), Fokus-Umriss (1), Stalker-Augen (3)
r.CustomDepth=3
; Volumetrischer Nebel fuer Lichtkegel von Laternen und Scheinwerfer
r.VolumetricFog=1
; 4 = feines Raster (teurer, schoener). Auf schwaecheren GPUs 8.
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSizeZ=128
; Kein Bewegungsunschaerfe-Schmieren beim Umdrehen
r.DefaultFeature.MotionBlur=False
; Dunkelheit soll dunkel bleiben: automatische Belichtung aus (im Post Process Volume fein einstellen)
r.DefaultFeature.AutoExposure=False
